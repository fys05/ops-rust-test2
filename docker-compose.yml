services:
  class-manager:
    build: .
    image: ops-rust-test2:latest
    container_name: ops-rust-test2
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/class_manager
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ops-rust-test2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: class_manager
    volumes:
      - class-manager-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  class-manager-data:
