services:
  class-manager:
    build: .
    image: ops-rust-test2:latest
    container_name: ops-rust-test2
    ports:
      - "8080:8080"
    environment:
      BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:/data/class_manager.db
    volumes:
      - class-manager-data:/data
    restart: unless-stopped

volumes:
  class-manager-data:
